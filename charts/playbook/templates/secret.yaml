{{- if not .Values.auth.existingSecret }}
{{- $name := include "playbook.secretName" . }}
{{- /* Re-use generated values on upgrade so passwords and sessions stay stable. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "playbook.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.adminPassword }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else }}
  ADMIN_PASSWORD: {{ get $existing "ADMIN_PASSWORD" | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if .Values.auth.sessionSecret }}
  SESSION_SECRET: {{ .Values.auth.sessionSecret | b64enc | quote }}
  {{- else }}
  SESSION_SECRET: {{ get $existing "SESSION_SECRET" | default (randAlphaNum 64 | b64enc) | quote }}
  {{- end }}
  {{- with .Values.integrations.gitlab.token }}
  GITLAB_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.integrations.openshift.token }}
  OPENSHIFT_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
