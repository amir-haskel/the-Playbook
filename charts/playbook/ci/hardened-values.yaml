# chart-testing: exercise the optional knobs together.
auth:
  adminPassword: ci-admin-password
branding:
  article: ""
  name: "CI Playbook"
scripts:
  restartOnChange: true
  inline:
    ci/inline_check.sh: |
      #!/usr/bin/env bash
      echo "inline script rendered from values"
persistence:
  db:
    size: 64Mi
  store:
    enabled: false
networkPolicy:
  enabled: true
  ingressFrom: []
ingress:
  enabled: true
  className: nginx
extraEnv:
  - name: EXAMPLE_SETTING
    value: "1"
