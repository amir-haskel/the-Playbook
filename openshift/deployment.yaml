apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspulse
  labels:
    app: opspulse
spec:
  replicas: 1               # SQLite on a single RWO PVC — keep at 1 replica.
  strategy:
    type: Recreate          # avoid two pods holding the same PVC/DB at once.
  selector:
    matchLabels:
      app: opspulse
  template:
    metadata:
      labels:
        app: opspulse
    spec:
      containers:
        - name: opspulse
          image: image-registry.openshift-image-registry.svc:5000/opspulse/opspulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Two separate volumes (see volumeMounts below): the SQLite DB lives
            # on its own PVC, execution outputs + uploads on another.
            - name: DB_DIR
              value: /data/db
            - name: STORE_DIR
              value: /data/store
            - name: SCRIPTS_DIR
              value: /scripts
          envFrom:
            - secretRef:
                name: opspulse-secrets
          volumeMounts:
            - name: db
              mountPath: /data/db
            - name: store
              mountPath: /data/store
            # Optional: mount operator-managed scripts from a ConfigMap instead
            # of baking them into the image. Uncomment and create the ConfigMap.
            # - name: scripts
            #   mountPath: /scripts
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: opspulse-db
        - name: store
          persistentVolumeClaim:
            claimName: opspulse-store
        # - name: scripts
        #   configMap:
        #     name: opspulse-scripts
        #     defaultMode: 0755
