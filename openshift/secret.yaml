# Template — DO NOT commit real secret values. Populate via `oc create secret`
# or a sealed-secret. stringData lets you provide plain values that OpenShift
# base64-encodes on apply.
apiVersion: v1
kind: Secret
metadata:
  name: opspulse-secrets
  labels:
    app: opspulse
type: Opaque
stringData:
  ADMIN_PASSWORD: "change-me"
  SESSION_SECRET: "replace-with-a-long-random-string"
  GITLAB_API_URL: "https://gitlab.example.com/api/v4"
  GITLAB_TOKEN: ""
  OPENSHIFT_API_URL: "https://api.openshift.example.com:6443"
  OPENSHIFT_TOKEN: ""
