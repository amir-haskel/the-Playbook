name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.16.2
  IMAGE: ghcr.io/${{ github.repository_owner }}/playbook

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Ruff
        run: ruff check app tests hack charts/playbook/scripts --select E9,F63,F7,F82,F401
      - name: Shellcheck bundled scripts
        run: find charts/playbook/scripts -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Pytest
        env:
          ADMIN_PASSWORD: ci
        run: pytest -q

  chart:
    name: Helm lint & schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          helm lint charts/playbook --strict
          for f in charts/playbook/ci/*-values.yaml; do
            helm lint charts/playbook --strict -f "$f"
          done
      - name: Render manifests
        run: |
          mkdir -p rendered
          helm template pb charts/playbook > rendered/default.yaml
          helm template pb charts/playbook -f charts/playbook/ci/hardened-values.yaml > rendered/hardened.yaml
          helm template pb charts/playbook --api-versions security.openshift.io/v1 \
            --set route.enabled=true > rendered/openshift.yaml
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          # Route is an OpenShift CRD without a published schema; everything else is validated strictly.
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 -skip Route rendered/*.yaml
      - name: OpenShift mode drops fixed UIDs
        run: |
          ! grep -E 'runAsUser|fsGroup:' rendered/openshift.yaml

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha

  e2e:
    name: Install chart on kind
    runs-on: ubuntu-latest
    needs: [test, chart]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Build and load image
        run: |
          docker build -t playbook:ci .
          kind load docker-image playbook:ci --name ci
      - name: helm install
        run: |
          kubectl create namespace playbook
          kubectl label namespace playbook pod-security.kubernetes.io/enforce=restricted
          helm install playbook charts/playbook -n playbook --wait --timeout 3m \
            -f charts/playbook/ci/default-values.yaml \
            --set image.repository=playbook --set image.tag=ci --set image.pullPolicy=Never
      - name: helm test
        run: helm test playbook -n playbook --logs
      - name: Scripts are mounted with their folder structure
        run: |
          kubectl -n playbook exec deploy/playbook -- ls -R /scripts
          kubectl -n playbook exec deploy/playbook -- test -f /scripts/deploy/deploy_service.sh
      - name: Seed demo catalog and run actions through the API
        run: |
          kubectl -n playbook port-forward svc/playbook 8000:8000 &
          sleep 3
          python3 hack/seed_demo.py --url http://localhost:8000 --password ci-admin-password --run
      - name: Upgrade keeps generated secrets stable
        run: |
          before=$(kubectl -n playbook get secret playbook-secrets -o jsonpath='{.data.SESSION_SECRET}')
          helm upgrade playbook charts/playbook -n playbook --wait --reuse-values
          after=$(kubectl -n playbook get secret playbook-secrets -o jsonpath='{.data.SESSION_SECRET}')
          test "$before" = "$after"
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n playbook get all,pvc,cm,secret
          kubectl -n playbook describe pods
          kubectl -n playbook logs deploy/playbook --tail=200 || true
